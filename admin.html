<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DUMPSTERFACIAL // ADMIN</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik+Glitch&family=Space+Grotesk:wght@400;500;700;900&family=Nosifer&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink: #ff007f;
            --green: #00ff66;
            --yellow: #ffe600;
            --orange: #ff5500;
            --cyan: #00f0ff;
            --red: #ff003c;

            --black: #050507;
            --dark: #0d0d11;
            --card: #15151b;
            --gray: #999;
            --white: #f2f2f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,0,127,.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 70%,
                    rgba(0,255,102,.08),
                    transparent 30%
                ),
                var(--black);

            color: var(--white);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1000px, calc(100% - 30px));
            margin: auto;
        }

        /* HEADER */

        header {
            border-bottom: 4px solid var(--pink);
            background: #000;
        }

        .header-inner {
            min-height: 75px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .logo {
            font-family: 'Rubik Glitch', sans-serif;
            color: var(--yellow);
            font-size: 1.5rem;
        }

        .epk-link {
            color: var(--green);
            font-weight: 900;
            font-size: .85rem;
        }

        /* LOGIN */

        #login-screen {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 450px;

            background: var(--card);

            border: 4px solid var(--pink);

            padding: 35px;

            box-shadow:
                10px 10px 0 var(--green);
        }

        .login-box h1 {
            margin-top: 0;

            font-family: 'Nosifer', cursive;

            color: var(--yellow);

            font-size: clamp(2rem, 8vw, 4rem);

            line-height: 1;
        }

        .login-box p {
            color: #aaa;
        }

        label {
            display: block;

            margin-top: 20px;
            margin-bottom: 7px;

            color: var(--green);

            font-family: 'Permanent Marker', cursive;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;

            padding: 14px;

            background: #000;

            color: white;

            border: 2px solid var(--yellow);

            font-family: inherit;

            font-size: 1rem;
        }

        button {
            cursor: pointer;

            border: 3px solid #000;

            font-family: 'Permanent Marker', cursive;

            font-size: 1rem;

            padding: 13px 20px;

            box-shadow: 5px 5px 0 #000;

            transition: .15s;
        }

        button:hover {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #000;
        }

        .pink-button {
            background: var(--pink);
            color: white;
        }

        .green-button {
            background: var(--green);
            color: #000;
        }

        .yellow-button {
            background: var(--yellow);
            color: #000;
        }

        .full-button {
            width: 100%;
            margin-top: 25px;
        }

        .message {
            margin-top: 20px;

            padding: 12px;

            display: none;

            border: 2px solid var(--red);

            background: rgba(255,0,60,.1);

            color: #fff;
        }

        /* ADMIN */

        #admin-screen {
            display: none;

            padding: 50px 0;
        }

        .admin-title {
            margin-bottom: 40px;
        }

        .admin-title h1 {
            margin: 0;

            font-family: 'Nosifer', cursive;

            color: var(--yellow);

            font-size: clamp(2.5rem, 8vw, 5rem);

            line-height: .95;

            text-shadow:
                5px 5px 0 var(--pink),
                -3px -3px 0 var(--cyan);
        }

        .admin-title p {
            color: var(--green);

            font-family: 'Permanent Marker', cursive;

            font-size: 1.2rem;
        }

        /* UPLOAD CARDS */

        .upload-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 50px;
        }

        .upload-card {
            background: var(--card);

            padding: 25px;

            border: 3px solid var(--green);

            box-shadow: 7px 7px 0 var(--orange);
        }

        .upload-card h2 {
            margin-top: 0;

            color: var(--yellow);

            font-family: 'Permanent Marker', cursive;

            font-size: 1.8rem;
        }

        .upload-card p {
            color: #aaa;
        }

        input[type="file"] {
            width: 100%;

            padding: 15px;

            margin-top: 15px;

            background: #000;

            border: 2px dashed var(--cyan);

            color: white;
        }

        .upload-button {
            width: 100%;

            margin-top: 15px;
        }

        /* PROGRESS */

        .progress-container {
            display: none;

            margin-top: 20px;
        }

        .progress-bar {
            height: 12px;

            width: 0%;

            background: var(--green);

            transition: width .2s;
        }

        .progress-track {
            background: #000;

            border: 2px solid var(--green);

            height: 16px;
        }

        /* MEDIA */

        .section-heading {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }

        .section-heading h2 {
            margin: 0;

            color: var(--yellow);

            font-family: 'Rubik Glitch', sans-serif;

            font-size: 2.5rem;
        }

        .media-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 15px;
        }

        .media-item {
            position: relative;

            background: #000;

            border: 3px solid var(--pink);

            overflow: hidden;
        }

        .media-item img,
        .media-item video {
            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;
        }

        .media-name {
            padding: 8px;

            font-size: .7rem;

            color: #aaa;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .delete-button {
            width: 100%;

            padding: 8px;

            border: 0;

            box-shadow: none;

            background: var(--red);

            color: white;

            font-family: 'Space Grotesk', sans-serif;

            font-weight: 900;

            font-size: .75rem;
        }

        .delete-button:hover {
            transform: none;

            box-shadow: none;

            background: #ff174f;
        }

        .empty {
            padding: 40px;

            text-align: center;

            border: 2px dashed #444;

            color: #666;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header-inner {
                flex-direction: column;

                align-items: flex-start;

                padding: 15px 0;
            }

            .upload-grid {
                grid-template-columns: 1fr;
            }

            .login-box {
                padding: 25px;

                box-shadow:
                    6px 6px 0 var(--green);
            }

            .media-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            #admin-screen {
                padding: 35px 0;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container header-inner">

        <div class="logo">
            DUMPSTERFACIAL // ADMIN
        </div>

        <a
            class="epk-link"
            href="index.html"
            target="_blank">
            ← VIEW PUBLIC EPK
        </a>

    </div>
</header>


<!-- =========================================================
     LOGIN
     ========================================================= -->

<div id="login-screen">

    <div class="container">

        <div class="login-box">

            <h1>ADMIN</h1>

            <p>
                TRA$H CULT MEDIA CONTROL CENTER
            </p>

            <form id="login-form">

                <label for="email">
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="your@email.com"
                    required>


                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="password"
                    required>


                <button
                    class="pink-button full-button"
                    type="submit">

                    ENTER THE TRASH

                </button>

            </form>

            <div
                id="login-message"
                class="message">
            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     ADMIN PANEL
     ========================================================= -->

<main id="admin-screen">

    <div class="container">

        <div class="admin-title">

            <h1>
                MEDIA<br>
                CONTROL
            </h1>

            <p>
                upload the evidence from your phone.
            </p>

        </div>


        <!-- UPLOADS -->

        <div class="upload-grid">


            <!-- PHOTOS -->

            <div class="upload-card">

                <h2>
                    📸 PHOTOS
                </h2>

                <p>
                    Select one or multiple photos from your phone.
                </p>

                <input
                    id="photo-input"
                    type="file"
                    accept="image/*"
                    multiple>

                <button
                    id="photo-upload"
                    class="green-button upload-button">

                    UPLOAD PHOTOS

                </button>

                <div
                    id="photo-progress"
                    class="progress-container">

                    <div class="progress-track">
                        <div
                            id="photo-progress-bar"
                            class="progress-bar">
                        </div>
                    </div>

                </div>

            </div>


            <!-- VIDEOS -->

            <div class="upload-card">

                <h2>
                    🎥 VIDEOS
                </h2>

                <p>
                    Select one or multiple videos from your phone.
                </p>

                <input
                    id="video-input"
                    type="file"
                    accept="video/*"
                    multiple>

                <button
                    id="video-upload"
                    class="pink-button upload-button">

                    UPLOAD VIDEOS

                </button>

                <div
                    id="video-progress"
                    class="progress-container">

                    <div class="progress-track">
                        <div
                            id="video-progress-bar"
                            class="progress-bar">
                        </div>
                    </div>

                </div>

            </div>

        </div>


        <!-- STATUS -->

        <div
            id="status-message"
            class="message">
        </div>


        <!-- MEDIA LIBRARY -->

        <div class="section-heading">

            <h2>
                MEDIA LIBRARY
            </h2>

            <button
                id="refresh-button"
                class="yellow-button">

                REFRESH

            </button>

        </div>


        <div
            id="media-grid"
            class="media-grid">

            <div class="empty">
                Loading media...
            </div>

        </div>

    </div>

</main>


<script>

    /* =========================================================
       SUPABASE CONFIG
       ========================================================= */

    const SUPABASE_URL =
        'https://ighohowuvdhpsicazcvx.supabase.co';

    const SUPABASE_KEY =
        'sb_publishable_U2uq7jruC6daV4ONUmjOsg_njW-dN-i';


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loginScreen =
        document.getElementById('login-screen');

    const adminScreen =
        document.getElementById('admin-screen');

    const loginForm =
        document.getElementById('login-form');

    const loginMessage =
        document.getElementById('login-message');

    const statusMessage =
        document.getElementById('status-message');

    const mediaGrid =
        document.getElementById('media-grid');

    const photoInput =
        document.getElementById('photo-input');

    const videoInput =
        document.getElementById('video-input');

    const photoUpload =
        document.getElementById('photo-upload');

    const videoUpload =
        document.getElementById('video-upload');

    const refreshButton =
        document.getElementById('refresh-button');


    /* =========================================================
       MESSAGE HELPERS
       ========================================================= */

    function showMessage(element, text) {

        element.textContent = text;

        element.style.display = 'block';

    }


    function hideMessage(element) {

        element.style.display = 'none';

    }


    /* =========================================================
       LOGIN
       ========================================================= */

    loginForm.addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();

            hideMessage(loginMessage);

            const email =
                document.getElementById('email').value.trim();

            const password =
                document.getElementById('password').value;


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });


            if (error) {

                showMessage(
                    loginMessage,
                    'LOGIN FAILED: ' + error.message
                );

                return;
            }


            showAdmin();

        }
    );


    /* =========================================================
       CHECK EXISTING LOGIN
       ========================================================= */

    async function checkLogin() {

        const {
            data
        } =
            await supabaseClient.auth.getSession();


        if (data.session) {

            showAdmin();

        }

    }


    /* =========================================================
       SHOW ADMIN
       ========================================================= */

    function showAdmin() {

        loginScreen.style.display = 'none';

        adminScreen.style.display = 'block';

        loadMedia();

    }


    /* =========================================================
       UPLOAD FILES
       ========================================================= */

    async function uploadFiles(
        files,
        type,
        progressContainer,
        progressBar
    ) {

        if (!files || files.length === 0) {

            showMessage(
                statusMessage,
                'SELECT SOME FILES FIRST.'
            );

            return;

        }


        progressContainer.style.display = 'block';

        progressBar.style.width = '0%';


        let completed = 0;


        for (const file of files) {

            try {

                /*
                    Give every upload a unique filename.
                */

                const extension =
                    file.name.includes('.')
                    ? file.name.substring(
                        file.name.lastIndexOf('.')
                    )
                    : '';

                const safeName =
                    file.name
                        .replace(
                            /[^a-zA-Z0-9._-]/g,
                            '_'
                        );

                const fileName =
                    Date.now()
                    + '_'
                    + Math.random()
                        .toString(36)
                        .substring(2, 8)
                    + '_'
                    + safeName;


                const filePath =
                    type + '/' + fileName;


                const {
                    error
                } =
                    await supabaseClient
                        .storage
                        .from('media')
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl: '3600',
                                upsert: false
                            }
                        );


                if (error) {

                    throw error;

                }


                completed++;

                progressBar.style.width =
                    (
                        completed /
                        files.length *
                        100
                    ) + '%';


            } catch (error) {

                console.error(error);

                showMessage(
                    statusMessage,
                    'UPLOAD ERROR: ' + error.message
                );

                progressContainer.style.display =
                    'none';

                return;

            }

        }


        progressBar.style.width = '100%';


        showMessage(
            statusMessage,
            completed +
            ' file(s) uploaded successfully.'
        );


        setTimeout(
            function() {

                progressContainer.style.display =
                    'none';

            },
            1000
        );


        loadMedia();

    }


    /* =========================================================
       PHOTO UPLOAD
       ========================================================= */

    photoUpload.addEventListener(
        'click',
        function() {

            uploadFiles(
                photoInput.files,
                'photos',
                document.getElementById(
                    'photo-progress'
                ),
                document.getElementById(
                    'photo-progress-bar'
                )
            );

        }
    );


    /* =========================================================
       VIDEO UPLOAD
       ========================================================= */

    videoUpload.addEventListener(
        'click',
        function() {

            uploadFiles(
                videoInput.files,
                'videos',
                document.getElementById(
                    'video-progress'
                ),
                document.getElementById(
                    'video-progress-bar'
                )
            );

        }
    );


    /* =========================================================
       GET PUBLIC FILE URL
       ========================================================= */

    function getPublicUrl(path) {

        const {
            data
        } =
            supabaseClient
                .storage
                .from('media')
                .getPublicUrl(path);

        return data.publicUrl;

    }


    /* =========================================================
       LOAD MEDIA
       ========================================================= */

    async function loadMedia() {

        mediaGrid.innerHTML =
            '<div class="empty">LOADING...</div>';


        let allFiles = [];


        /*
            Get photos
        */

        const {
            data: photos,
            error: photoError
        } =
            await supabaseClient
                .storage
                .from('media')
                .list(
                    'photos',
                    {
                        limit: 100,
                        sortBy: {
                            column: 'created_at',
                            order: 'desc'
                        }
                    }
                );


        /*
            Get videos
        */

        const {
            data: videos,
            error: videoError
        } =
            await supabaseClient
                .storage
                .from('media')
                .list(
                    'videos',
                    {
                        limit: 100,
                        sortBy: {
                            column: 'created_at',
                            order: 'desc'
                        }
                    }
                );


        if (photoError || videoError) {

            console.error(
                photoError || videoError
            );

            mediaGrid.innerHTML =
                '<div class="empty">Could not load media.</div>';

            return;

        }


        if (photos) {

            photos.forEach(
                function(file) {

                    if (!file.name) return;

                    allFiles.push({
                        name: file.name,
                        path: 'photos/' + file.name,
                        type: 'photo',
                        created: file.created_at
                    });

                }
            );

        }


        if (videos) {

            videos.forEach(
                function(file) {

                    if (!file.name) return;

                    allFiles.push({
                        name: file.name,
                        path: 'videos/' + file.name,
                        type: 'video',
                        created: file.created_at
                    });

                }
            );

        }


        /*
            Sort newest first.
        */

        allFiles.sort(
            function(a, b) {

                return new Date(b.created) -
                       new Date(a.created);

            }
        );


        if (allFiles.length === 0) {

            mediaGrid.innerHTML =
                '<div class="empty">' +
                'NO MEDIA YET.<br><br>' +
                'UPLOAD SOME CHAOS.' +
                '</div>';

            return;

        }


        mediaGrid.innerHTML = '';


        allFiles.forEach(
            function(file) {

                const item =
                    document.createElement('div');

                item.className =
                    'media-item';


                const url =
                    getPublicUrl(file.path);


                if (file.type === 'photo') {

                    item.innerHTML = `
                        <img
                            src="${url}"
                            alt="${escapeHtml(file.name)}"
                            loading="lazy">

                        <div class="media-name">
                            ${escapeHtml(file.name)}
                        </div>

                        <button
                            class="delete-button"
                            onclick="deleteMedia('${escapeJs(file.path)}')">

                            DELETE

                        </button>
                    `;

                } else {

                    item.innerHTML = `
                        <video
                            src="${url}"
                            controls
                            preload="metadata">
                        </video>

                        <div class="media-name">
                            ${escapeHtml(file.name)}
                        </div>

                        <button
                            class="delete-button"
                            onclick="deleteMedia('${escapeJs(file.path)}')">

                            DELETE

                        </button>
                    `;

                }


                mediaGrid.appendChild(item);

            }
        );

    }


    /* =========================================================
       DELETE MEDIA
       ========================================================= */

    window.deleteMedia =
        async function(path) {

            const confirmed =
                confirm(
                    'Delete this file permanently?'
                );


            if (!confirmed) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .storage
                    .from('media')
                    .remove([path]);


            if (error) {

                showMessage(
                    statusMessage,
                    'DELETE ERROR: ' +
                    error.message
                );

                return;

            }


            showMessage(
                statusMessage,
                'FILE DELETED.'
            );


            loadMedia();

        };


    /* =========================================================
       REFRESH
       ========================================================= */

    refreshButton.addEventListener(
        'click',
        loadMedia
    );


    /* =========================================================
       HTML SAFETY
       ========================================================= */

    function escapeHtml(text) {

        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    function escapeJs(text) {

        return String(text)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'");

    }


    /* =========================================================
       START
       ========================================================= */

    checkLogin();

</script>

</body>
</html>
